<?xml version="1.0" encoding="UTF-8"?>
<!-- Jarvis Simple app icon: a glowing ring (the assistant listening) around a voice waveform.
     Original artwork, rendered into the asset catalog by scripts/render-icons.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b2e"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee8ff"/>
      <stop offset="1" stop-color="#2f7bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#38b6ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38b6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#16304f"/>
      <stop offset="1" stop-color="#0a1424"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- Glow and ring -->
  <circle cx="512" cy="512" r="400" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="318" fill="url(#core)"/>
  <circle cx="512" cy="512" r="318" fill="none" stroke="url(#ring)" stroke-width="34" filter="url(#soft)" opacity="0.8"/>
  <circle cx="512" cy="512" r="318" fill="none" stroke="url(#ring)" stroke-width="26"/>
  <circle cx="512" cy="512" r="266" fill="none" stroke="#7ee8ff" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Voice waveform -->
  <g fill="#ffffff">
    <rect x="338" y="452" width="44" height="120" rx="22"/>
    <rect x="414" y="382" width="44" height="260" rx="22"/>
    <rect x="490" y="312" width="44" height="400" rx="22"/>
    <rect x="566" y="362" width="44" height="300" rx="22"/>
    <rect x="642" y="432" width="44" height="160" rx="22"/>
  </g>
</svg>
