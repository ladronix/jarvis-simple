name: Feature request
description: Suggest an improvement. Jarvis Simple stays a plain dictation tool.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation and why the current behavior gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
