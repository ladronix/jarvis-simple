name: Model manifest

# The pinned model files must still exist on Hugging Face with the recorded hashes.
on:
  pull_request:
    paths:
      - scripts/model-manifest.py
      - Core/Sources/JarvisCore/Models/**
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Manifest matches Hugging Face
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I scripts/model-manifest.py --check
